<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Máy tính</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: white;
        }
        .calculator {
            width: 100%;
            max-width: 650px;
            margin: auto;
            padding: 32px;
            background: #111827;
            border-radius: 30px;
        }
        .screen {
            height: 162px;
            padding: 25px;
            margin-bottom: 25px;
            background: #022c22;
            color: #4ade80;
            border-radius: 20px;
            text-align: right;
            overflow: hidden;
        }
        #expression {
            min-height: 35px;
            font-size: 23px;
            color: #259e69;
            overflow-wrap: anywhere;
        }
        #result {
            margin-top: 5px;
            font-size: 56px;
            font-weight: bold;
            overflow-wrap: anywhere;
        }
        .buttons {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 16px;
        }
        button {
            height: 86px;
            border: none;
            border-radius: 16px;
            background: #25313f;
            color: #e5e7eb;
            font-size: 28px;
            cursor: pointer;
        }
        button:hover {
            opacity: 0.8;
        }
        .operator {
            background: #0d6efd;
            color: white;
        }
        .clear {
            background: #dc2626;
            color: white;
        }
        .equal {
            background: #16a34a;
            color: white;
        }
        .zero {
            grid-column: span 2;
        }
        @media (max-width: 500px) {
            .calculator {
                padding: 16px;
                border-radius: 22px;
            }
            .buttons {
                gap: 10px;
            }
            button {
                height: 65px;
                font-size: 23px;
                border-radius: 12px;
            }
            #result {
                font-size: 42px;
            }
        }
    </style>
</head>
<body>
    <div class="calculator">
        <div class="screen">
            <div id="expression"></div>
            <div id="result">0</div>
        </div>
        <div class="buttons">
            <button class="clear" onclick="xoa()">C</button>
            <button class="operator" onclick="ngoac()">( )</button>
            <button class="operator" onclick="phanTram()">%</button>
            <button class="operator" onclick="chonPhep('/')">÷</button>
            <button onclick="nhapSo('7')">7</button>
            <button onclick="nhapSo('8')">8</button>
            <button onclick="nhapSo('9')">9</button>
            <button class="operator" onclick="chonPhep('*')">×</button>
            <button onclick="nhapSo('4')">4</button>
            <button onclick="nhapSo('5')">5</button>
            <button onclick="nhapSo('6')">6</button>
            <button class="operator" onclick="chonPhep('-')">−</button>
            <button onclick="nhapSo('1')">1</button>
            <button onclick="nhapSo('2')">2</button>
            <button onclick="nhapSo('3')">3</button>
            <button class="operator" onclick="chonPhep('+')">+</button>
            <button class="zero" onclick="nhapSo('0')">0</button>
            <button onclick="nhapSo('.')">.</button>
            <button class="equal" onclick="tinh()">=</button>
        </div>
    </div>
    <script>
        let bieuThuc = "";
        let daTinh = false;
        const expression = document.getElementById("expression");
        const result = document.getElementById("result");
        function capNhat() {
            expression.textContent = bieuThuc
                .replace(/\*/g, " × ")
                .replace(/\//g, " ÷ ")
                .replace(/\+/g, " + ")
                .replace(/-/g, " − ");
            if (bieuThuc === "") {
                result.textContent = "0";
            }
        }
        function nhapSo(so) {
            if (daTinh) {
                bieuThuc = "";
                daTinh = false;
            }
            if (so === ".") {
                let phanTuCuoi = bieuThuc.split(/[+\-*/()]/).pop();
                if (phanTuCuoi.includes(".")) {
                    return;
                }
                if (phanTuCuoi === "") {
                    bieuThuc += "0";
                }
            }
            bieuThuc += so;
            capNhat();
        }
        function chonPhep(phep) {
            if (daTinh) {
                daTinh = false;
            }
            if (bieuThuc === "") {
                if (phep === "-") {
                    bieuThuc = "-";
                    capNhat();
                }
                return;
            }
            if (/[+\-*/.]$/.test(bieuThuc)) {
                bieuThuc = bieuThuc.slice(0, -1);
            }
            bieuThuc += phep;
            capNhat();
        }
        function ngoac() {
            if (daTinh) {
                bieuThuc = "";
                daTinh = false;
            }
            let mo = (bieuThuc.match(/\(/g) || []).length;
            let dong = (bieuThuc.match(/\)/g) || []).length;
            if (
                bieuThuc === "" ||
                /[+\-*/(]$/.test(bieuThuc)
            ) {
                bieuThuc += "(";
            } else if (mo > dong) {
                bieuThuc += ")";
            } else {
                bieuThuc += "*(";
            }
            capNhat();
        }
        function phanTram() {
            if (bieuThuc === "" || /[+\-*/.]$/.test(bieuThuc)) {
                return;
            }
            bieuThuc += "/100";
            capNhat();
        }
        function tinh() {
            if (bieuThuc === "") {
                return;
            }
            try {
                if (!/^[0-9+\-*/().\s]+$/.test(bieuThuc)) {
                    throw new Error("Biểu thức không hợp lệ");
                }
                let ketQua = Function(
                    '"use strict"; return (' + bieuThuc + ')'
                )();
                if (!Number.isFinite(ketQua)) {
                    throw new Error("Không thể tính");
                }
                result.textContent = Number(
                    ketQua.toPrecision(12)
                );
                expression.textContent = bieuThuc
                    .replace(/\*/g, " × ")
                    .replace(/\//g, " ÷ ")
                    .replace(/\+/g, " + ")
                    .replace(/-/g, " − ");
                bieuThuc = String(Number(ketQua.toPrecision(12)));
                daTinh = true;
            } catch (e) {
                result.textContent = "Lỗi";
                daTinh = true;
            }
        }
        function xoa() {
            bieuThuc = "";
            daTinh = false;
            expression.textContent = "";
            result.textContent = "0";
        }
    </script>
</body>
</html>
