<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewpoint" content="width=device=width,initial-scale=1.0">
    <title>Các món ngon Hà Nội</title>
<style>
    body{
        background-color:#F8F0DC;
        font-family:"Times New Roman",serif;
    }
    .container{
        width:90%;
        margin:20px auto;
        padding:20px;
    }
    h1{
        color:#E65100;
        text-align:center;
    }
    .left{
        width:28%;
        float:left;
        text-align:center;
    }
    .left img{
        width:180px;
        margin-top:30px;
        border-radius:8px;
    }
    .right{
        width:68%;
        float:right;
    }
    table{
        width:100%;
        border-collapse:collapse;
    }
    th,
    td{
        padding:8px;
        border-bottom:1px solid #D8D0C0;
    }
    th{
        background-color:#E65100;
        color:white;
        text-align:center;
    }
    th:first-child,td:first-child{
        width:70px;
        text-align:center;
    }
    tbody tr:nth-child(odd){
        background-color:white;
    }
    tbody tr:nth-child(even){
        background-color:#FDF8EF;
    }
    .clear{
        clear:both;
    }
</style>      
</head>
<body>
    <div class="container">
        <h1>Các món ngon Hà Nội</h1>
        <div class="left">
            <img src="Anh\Bai06\Bat.gif" alt="Các món ngon Hà Nội">
        </div>
        <div class="right">
            <table>
                <thead>
                    <tr>
                        <th>STT</th>
                        <th>Tên mõn ăn</th>
                    </tr>    
                </thead>
                <tbody>
                    <tr>
                        <td>1</td>
                        <td>Bánh cuốn Thanh Trì</td>
                    </tr>
                    <tr>
                        <td>2</td>
                        <td>Xôi Hà Nội</td>
                    </tr>
                    <tr>
                        <td>3</td>
                        <td>Chả cá Lã Vọng</td>
                    </tr>
                    <tr>
                        <td>4</td>
                        <td>Cháo Cóc</td>
                    </tr>
                    <tr>
                        <td>5</td>
                        <td>Bánh Gai Ninh Giang</td>
                    </tr>
                    <tr>
                        <td>6</td>
                        <td>Bún Thang Hà Nội</td>
                    </tr>
                    <tr>
                        <td>7</td>
                        <td>Canh Lằng</td>
                    </tr>
                    <tr>
                        <td>8</td>
                        <td>Vịt quay Lạng Sơn</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
