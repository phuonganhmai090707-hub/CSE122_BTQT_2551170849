<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Bootstrap</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <style>
        body {
            font-family: Arial, sans-serif;
            font-size: 12px;
            background: white;
        }
        .dashboard {
            width: 85%;
            min-height: 490px;
            margin: 15px auto;
            display: flex;
        }
        .sidebar {
            width: 230px;
            flex-shrink: 0;
            background: #212529;
            color: white;
            padding: 12px 5px;
        }
        .logo {
            font-weight: bold;
            margin: 0 5px 15px;
        }
        .sidebar .nav-link {
            color: #adb5bd;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 2px;
        }
        .sidebar .nav-link.active {
            background: #0d6efd;
            color: white;
        }
        .content {
            flex: 1;
            min-width: 0;
            background: #e9ecef;
            padding: 15px;
        }
        .page-title {
            font-size: 16px;
            font-weight: bold;
        }
        .small-card {
            border: 0;
            box-shadow: 0 2px 4px #00000010;
        }
        .small-card .card-body {
            padding: 12px 10px;
        }
        .stat-title {
            color: #6c757d;
            margin-bottom: 5px;
        }
        .stat-number {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 7px;
        }
        .progress {
            height: 4px;
        }
        .chapter-list {
            border: 0;
            box-shadow: 0 2px 4px #00000010;
        }
        .chapter-heading {
            font-weight: bold;
            padding: 10px;
            border-bottom: 1px solid #dee2e6;
        }
        .list-group-item {
            padding: 7px 10px;
            font-size: 12px;
        }
        .badge {
            font-size: 10px;
        }
        @media (max-width: 700px) {
            .dashboard {
                width: 95%;
            }
            .sidebar {
                width: 130px;
            }
        }
        @media (max-width: 450px) {
            .dashboard {
                flex-direction: column;
            }
            .sidebar {
                width: 100%;
            }
            .sidebar .nav {
                flex-direction: row !important;
                flex-wrap: wrap;
            }
            .content {
                padding: 10px;
            }
        }
    </style>
</head>
<body>
<div class="dashboard">
    <aside class="sidebar">
        <div class="logo">CSE TLU Admin</div>
        <nav class="nav flex-column">
            <a href="#" class="nav-link active">Bảng điều khiển</a>
            <a href="#" class="nav-link">Bài tập</a>
            <a href="#" class="nav-link">Sinh viên</a>
            <a href="#" class="nav-link">Điểm số</a>
        </nav>
    </aside>
    <main class="content">
        <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
            <h1 class="page-title mb-0">Bảng điều khiển</h1>
            <div>
                <button class="btn btn-warning btn-sm py-1 px-2"
                        style="font-size: 10px;">
                    3 bài mới
                </button>
                <button class="btn btn-primary btn-sm py-1 px-2"
                        style="font-size: 10px;">
                    Xuất báo cáo
                </button>
            </div>
        </div>
        <div class="row g-2 mb-3">
            <div class="col-6 col-md-3">
                <div class="card small-card h-100">
                    <div class="card-body">
                        <p class="stat-title">Sinh viên</p>
                        <div class="stat-number">128</div>
                        <div class="progress">
                            <div class="progress-bar bg-primary"
                                 style="width: 80%;"></div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="card small-card h-100">
                    <div class="card-body">
                        <p class="stat-title">Đã nộp</p>
                        <div class="stat-number">96</div>
                        <div class="progress">
                            <div class="progress-bar bg-success"
                                 style="width: 75%;"></div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="card small-card h-100">
                    <div class="card-body">
                        <p class="stat-title">Chưa nộp</p>
                        <div class="stat-number">32</div>
                        <div class="progress">
                            <div class="progress-bar bg-danger"
                                 style="width: 25%;"></div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="card small-card h-100">
                    <div class="card-body">
                        <p class="stat-title">Điểm TB</p>
                        <div class="stat-number">7.8</div>
                        <div class="progress">
                            <div class="progress-bar"
                                 style="width: 80%; background: #ffc107;"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="card chapter-list">
            <div class="chapter-heading">
                Tiến độ theo chương
            </div>
            <div class="list-group list-group-flush">
                <div class="list-group-item d-flex justify-content-between align-items-center">
                    <span>Chương 1 — HTML5</span>
                    <span class="badge bg-success">100%</span>
                </div>
                <div class="list-group-item d-flex justify-content-between align-items-center">
                    <span>Chương 2 — JavaScript</span>
                    <span class="badge text-bg-info">82%</span>
                </div>
                <div class="list-group-item d-flex justify-content-between align-items-center">
                    <span>Chương 3 — CSS3</span>
                    <span class="badge text-bg-info">74%</span>
                </div>
                <div class="list-group-item d-flex justify-content-between align-items-center">
                    <span>Chương 4 — Bootstrap 5</span>
                    <span class="badge bg-secondary">45%</span>
                </div>
            </div>
        </div>
    </main>
</div>
</body>
</html>
