<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewpoint" content="width=device=width,initial-scale=1.0">
    <title>Hệ thống bài tập Lập trình Web</title>
<style>
    body{
        font-family:Arial;
        font-size:11px;
    }
    .container{
        width:90%;
        margin:auto;
    }
    .banner{
        background:#C62828 url("Anh\Bai21\Nen_banner.jpg")center/cover no-repeat;
        color:white;
        padding:15px;
        font-size:14px;
        font-weight:bold;
    }
    .layout{
        display:flex;
    }
    .menu{
        width:120px;
        min-height:318px;
        background:linear-gradient(#C62828,#8E0000);
    }
    .menu a{
        display:block;
        color:white;
        padding:10px;
        text-decoration:none;
        border-bottom:1px solid #ffffff30;
    }
    .content{
        flex:1;
        padding:12px;
    }
    h2{
        color:#C62828;
        font-size:15px;
        margin:0 0 10px;
    }
    .sub{
        background:#FFE082;
        padding:8px;
        border-radius:4px;
    }
    .intro{
        border:1px solid #e0e0e0;
        border-radius:4px;
        padding:18px;
        margin-top:10px;
        text-align:center;
    }
    .ads{
        width:100px;
        padding:10px 8px;
    }
    .ads img{
        width:85px;
        margin-bottom:8px;
    }
    @media(max-width:600px){
        .layout{
            flex-wrap:wrap;
        }
        .menu,.content,.ads{
            width:100%;
        }
        .menu{
            min-height:auto;
        }
    }
</style>
</head>
<body>
    <div class="container">
        <div class="banner">
            <img src="Anh\Bai21\LogoTT.gif" width="35" alt="Logo">
            Hệ thống bài tập Lập trình Web
        </div>
        <div class="layout">
            <div class="menu">
                <a href="#">Ngôn ngữ HTML</a>
                <a href="#">Ngôn ngữ JavaScript</a>
                <a href="#">Các đối tượng trong JavaScript</a>
                <a href="#">CSS và bố cục hiện đại</a>
            </div>
            <div class="content">
                <h2>Bài tập HTML cơ bản</h2>
                <div class="sub">
                    Đảo chuỗi &nbsp; Phân tích chuỗi &nbsp; Tìm và thay thế
                </div>
                <div class="intro">
                    Thiết kế trang web có nội dung như sau:
                    <br><br>
                    Trung tâm Tin học-ĐHKHTN
                    <br>
                    Chào mừng các bạn đến với ngôn ngữ HTML
                </div>
            </div>
            <div class="ads">
                <img src="Anh\Bai21\Qcao01.gif" alt="Quảng cáo 1">
                <img src="Anh\Bai21\Qcao02.gif" alt="Quảng cáo 2">
            </div>
        </div>
    </div>
</body>
</html>
