<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký CLB Lập trình Web</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <style>
        body {
            background-color: #e9ecef;
            font-family: Arial, sans-serif;
        }
        .khung {
            max-width: 640px;
            margin: 50px auto;
            background-color: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.12);
        }
        .tieu-de {
            background-color: #198754;
            color: white;
            text-align: center;
            padding: 16px 10px;
        }
        .tieu-de h3 {
            margin: 0;
            font-size: 24px;
        }
        .noi-dung {
            padding: 24px;
        }
        .form-label {
            font-weight: 500;
        }
        .nhom-nut {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 20px;
        }
        .btn-success {
            background-color: #198754;
        }
        @media (max-width: 576px) {
            .khung {
                margin: 20px 12px;
            }
            .noi-dung {
                padding: 18px;
            }
            .tieu-de h3 {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="khung">
        <div class="tieu-de">
            <h3>Đăng ký tham gia CLB Lập trình Web</h3>
        </div>
        <div class="noi-dung">
            <form id="formDangKy">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label for="hoTen" class="form-label">Họ và tên</label>
                        <input type="text" class="form-control" id="hoTen"
                               placeholder="Nguyễn Văn A" required>
                    </div>
                    <div class="col-md-6">
                        <label for="maSV" class="form-label">Mã sinh viên</label>
                        <input type="text" class="form-control" id="maSV"
                               placeholder="22xxxxxx" required>
                    </div>
                    <div class="col-md-6">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email"
                               placeholder="sv@tlu.edu.vn" required>
                    </div>
                    <div class="col-md-6">
                        <label for="dienThoai" class="form-label">Số điện thoại</label>
                        <input type="tel" class="form-control" id="dienThoai"
                               placeholder="09xxxxxxxx" required>
                    </div>
                    <div class="col-12">
                        <label class="form-label d-block">Trình độ</label>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio"
                                   name="trinhDo" id="coBan" value="Cơ bản"
                                   required checked>
                            <label class="form-check-label" for="coBan">
                                Cơ bản
                            </label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio"
                                   name="trinhDo" id="kha" value="Khá">
                            <label class="form-check-label" for="kha">
                                Khá
                            </label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio"
                                   name="trinhDo" id="tot" value="Tốt">
                            <label class="form-check-label" for="tot">
                                Tốt
                            </label>
                        </div>
                    </div>
                    <div class="col-12">
                        <label for="lop" class="form-label">Chọn lớp</label>
                        <select class="form-select" id="lop" required>
                            <option value="67CNTT1">67CNTT1</option>
                            <option value="67CNTT2">67CNTT2</option>
                            <option value="67KTPM1">67KTPM1</option>
                        </select>
                    </div>
                    <div class="col-12">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox"
                                   id="camKet" required>
                            <label class="form-check-label" for="camKet">
                                Tôi cam kết tự làm bài và quay video OBS
                            </label>
                        </div>
                    </div>
                </div>
                <div class="nhom-nut">
                    <button type="reset" class="btn btn-outline-secondary">
                        Nhập lại
                    </button>
                    <button type="submit" class="btn btn-success px-4">
                        Đăng ký
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.getElementById("formDangKy").addEventListener("submit", function(event) {
        event.preventDefault();
        alert("Đăng ký thành công!");
        this.reset();
    });
</script>
</body>
</html>
