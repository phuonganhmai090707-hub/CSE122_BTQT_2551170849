<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewpoint" content="width=device=width,initial-scale=1.0">
    <title>Bốn Mùa</title>
    <style>
        body{
            background-color:#FFFDE7;
            border:1px solid #9E9E9E;
            width:90%;
            margin:auto;
            padding:20px;
        }
        h1{
            background-color:#FFD9E6;
            color:#D40000;
            text-align:center;
            font-weight:bold;
            padding:5px;
        }
        .tho{
            width:55%;
            margin:auto;
            text-align:center;
            font-style:italic;
            line-height:1.8;
        }
        .xanh{
           color:#0033CC; 
        }
        .do{
            color:#D40000;
        }
        hr{
            width:55%;
            border:0;
            border-top:2px solid #0033CC;
        }
    </style>
</head>
<body>
   <h1>BỐN MÙA</h1>
   <div class="tho">
    <div class="xanh">
        Xuân về hoa nở khắp nơi<br>
        Hạ sang nắng cháy rạng ngời phố quen<br>
        thu về lá rụng bên thềm
    </div>
    <hr>
    <div class="do">
        Đông sang gió lạnh bên em đợi chờ<br>
        Bốn mùa là bốn giấc mơ<br>
        Thời gian đi mãi ta chờ đợi ai
    </div>
    <hr>
    <div class="xanh">
        Một năm rồi lại một năm<br>
        Vẫn còn câu hát thì thầm quê hương<br>
        Chờ xuân nắng mới soi đường
    </div>
   </div>
</body>
</html>
